<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seoul Weather</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #EAEEF6; background-image: radial-gradient(#C9D1E4 1px, transparent 1px); background-size: 22px 22px; color: #0D1633; padding: 24px 16px 48px; }
  .wrap { max-width: 640px; margin: 0 auto; text-align: center; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  p.sub { color: #4A5578; margin-bottom: 18px; }
  button { padding: 10px 18px; border: 0; border-radius: 10px; background: #2F4BFF; color: #fff; font-size: 1rem; cursor: pointer; margin-bottom: 16px; }
  button:hover { background: #1E33CC; }
  #status { color: #4A5578; margin: 10px 0; }
  #status.error { color: #dc2626; }
  .current { background: #fff; border-radius: 16px; padding: 22px; margin-bottom: 16px; }
  .current .temp { font-size: 3rem; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .day { background: #fff; border-radius: 12px; padding: 12px; }
  .day b { display: block; margin-bottom: 4px; }
  .day span { color: #4A5578; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌤️ Seoul Weather</h1>
  <p class="sub">Current weather and 7-day forecast for Seoul, South Korea.</p>
  <button id="loadBtn">Get Seoul Weather</button>
  <div id="status">Click the button to load the weather.</div>
  <div id="current"></div>
  <div id="forecast" class="grid"></div>
</div>
<script>
  const statusEl = document.getElementById('status');
  const currentEl = document.getElementById('current');
  const forecastEl = document.getElementById('forecast');

  function codeLabel(code) {
    const map = { 0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
      45: 'Foggy', 51: 'Light drizzle', 61: 'Rain', 71: 'Snow', 80: 'Rain showers', 95: 'Thunderstorm' };
    return map[code] || 'Weather code ' + code;
  }

  async function getWeather() {
    statusEl.className = '';
    statusEl.textContent = 'Loading Seoul weather...';
    try {
      // Seoul, South Korea: latitude 37.5665, longitude 126.9780
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780' +
        '&current=temperature_2m,weather_code,wind_speed_10m' +
        '&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=7&timezone=Asia%2FSeoul';
      const res = await fetch(url);
      const data = await res.json();
      statusEl.textContent = 'Seoul, South Korea';
      currentEl.innerHTML = '<div class="temp">' + Math.round(data.current.temperature_2m) + '°C</div>' +
        '<p>' + codeLabel(data.current.weather_code) + ' &middot; Wind ' +
        Math.round(data.current.wind_speed_10m) + ' km/h</p>';
      forecastEl.innerHTML = data.daily.time.map((d, i) =>
        '<div class="day"><b>' + new Date(d).toLocaleDateString('en', { weekday: 'short' }) + '</b>' +
        '<span>' + codeLabel(data.daily.weather_code[i]) + '</span><br>' +
        Math.round(data.daily.temperature_2m_max[i]) + '° / ' + Math.round(data.daily.temperature_2m_min[i]) + '°</div>'
      ).join('');
    } catch (e) {
      statusEl.className = 'error';
      statusEl.textContent = 'Failed to load. Please try again!';
    }
  }

  document.getElementById('loadBtn').addEventListener('click', getWeather);
  getWeather();
</script>
</body>
</html>

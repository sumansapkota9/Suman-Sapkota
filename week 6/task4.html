<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random User</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #EAEEF6; background-image: radial-gradient(#C9D1E4 1px, transparent 1px); background-size: 22px 22px; color: #0D1633; padding: 24px 16px 48px; }
  .wrap { max-width: 520px; margin: 0 auto; text-align: center; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  p.sub { color: #4A5578; margin-bottom: 18px; }
  button { padding: 10px 18px; border: 0; border-radius: 10px; background: #2F4BFF; color: #fff; font-size: 1rem; cursor: pointer; margin-bottom: 16px; }
  button:hover { background: #1E33CC; }
  #status { color: #4A5578; margin: 10px 0; }
  #status.error { color: #dc2626; }
  .card { background: #fff; border-radius: 16px; padding: 22px; }
  .card img { width: 120px; height: 120px; border-radius: 50%; margin-bottom: 12px; }
  .card h3 { margin-bottom: 6px; }
  .card p { color: #4A5578; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>👤 Random User</h1>
  <p class="sub">Click the button to meet a new random person.</p>
  <button id="genBtn">New User</button>
  <div id="status">Click "New User" to load a person.</div>
  <div id="user"></div>
</div>
<script>
  const statusEl = document.getElementById('status');
  const userEl = document.getElementById('user');

  async function generate() {
    statusEl.className = '';
    statusEl.textContent = 'Loading...';
    try {
      const res = await fetch('https://randomuser.me/api/');
      const data = await res.json();
      const u = data.results[0];
      const name = u.name.first + ' ' + u.name.last;
      statusEl.textContent = 'Here is your random user:';
      userEl.innerHTML = '<div class="card"><img src="' + u.picture.large + '" alt="Photo of ' + name + '">' +
        '<h3>' + name + '</h3>' +
        '<p>' + u.email + '<br>' + u.location.city + ', ' + u.location.country +
        '<br>Age ' + u.dob.age + '</p></div>';
    } catch (e) {
      statusEl.className = 'error';
      statusEl.textContent = 'Failed to load. Please try again!';
    }
  }

  document.getElementById('genBtn').addEventListener('click', generate);
  generate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Search</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #EAEEF6; color: #0D1633; }
  header { background: #0D1633; color: #fff; padding: 22px 16px; text-align: center; }
  header p { color: #C7D2FE; margin-top: 4px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px; }
  .controls { display: flex; gap: 10px; margin-bottom: 16px; }
  .controls input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; background: #fff; }
  button { padding: 10px 18px; border: 0; border-radius: 10px; background: #2F4BFF; color: #fff; font-size: 1rem; cursor: pointer; }
  button:hover { background: #1E33CC; }
  button:disabled { opacity: 0.6; }
  #status { color: #4A5578; margin: 10px 0; }
  #status.error { color: #dc2626; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; display: flex; gap: 12px; }
  .card img { width: 60px; height: 90px; object-fit: cover; border-radius: 6px; background: #EAEEF6; }
  .card h3 { font-size: 1rem; margin-bottom: 4px; }
  .card p { color: #4A5578; font-size: 0.9rem; line-height: 1.4; }
  .placeholder { background: #fff; border-radius: 12px; padding: 14px; color: #9ca3af; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>
<header>
  <h1>Book Search</h1>
  <p>Discover your next favorite book.</p>
</header>
<div class="wrap">
  <form class="controls" id="searchForm">
    <input id="query" type="text" placeholder="Enter a book title or author" value="Harry Potter">
    <button id="searchBtn" type="submit">Search</button>
  </form>
  <p id="status"></p>
  <div id="books" class="grid"></div>
</div>
<script>
  const statusEl = document.getElementById('status');
  const booksEl = document.getElementById('books');
  const btn = document.getElementById('searchBtn');
  async function searchBooks() {
    const q = document.getElementById('query').value.trim();
    if (!q) { statusEl.textContent = 'Please type a book title or author.'; return; }
    statusEl.className = '';
    statusEl.textContent = 'Searching...';
    btn.disabled = true;
    btn.textContent = 'Searching...';
    booksEl.innerHTML = Array.from({ length: 6 }).map(() =>
      '<div class="placeholder">Loading book...</div>').join('');
    try {
      const res = await fetch('https://openlibrary.org/search.json?q=' + encodeURIComponent(q) + '&limit=12');
      const data = await res.json();
      if (!data.docs.length) { booksEl.innerHTML = ''; statusEl.textContent = 'No books found.'; return; }
      statusEl.textContent = data.numFound.toLocaleString() + ' results found. Showing up to 12.';
      booksEl.innerHTML = data.docs.map(b => {
        const cover = b.cover_i ? 'https://covers.openlibrary.org/b/id/' + b.cover_i + '-M.jpg' : '';
        return '<article class="card">' + (cover ? '<img src="' + cover + '" alt="Book cover">' : '') +
          '<div><h3>' + (b.title || 'Unknown title') + '</h3><p>' +
          (b.author_name ? b.author_name.join(', ') : 'Unknown author') + '<br>' +
          'First published: ' + (b.first_publish_year || '—') + '</p></div></article>';
      }).join('');
    } catch (err) {
      booksEl.innerHTML = '';
      statusEl.className = 'error';
      statusEl.textContent = 'Failed to search. Please try again!';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Search';
    }
  }
  document.getElementById('searchForm').addEventListener('submit', e => { e.preventDefault(); searchBooks(); });
  searchBooks();
</script>
</body>
</html>

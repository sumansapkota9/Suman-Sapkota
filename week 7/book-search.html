<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Search</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #EAEEF6; background-image: radial-gradient(#C9D1E4 1px, transparent 1px); background-size: 22px 22px; color: #0D1633; padding: 24px 16px 48px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  p.sub { color: #4A5578; margin-bottom: 18px; }
  .controls { display: flex; gap: 10px; margin-bottom: 16px; }
  .controls input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; background: #fff; }
  button { padding: 10px 18px; border: 0; border-radius: 10px; background: #2F4BFF; color: #fff; font-size: 1rem; cursor: pointer; }
  button:hover { background: #1E33CC; }
  #status { color: #4A5578; margin: 10px 0; }
  #status.error { color: #dc2626; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; display: flex; gap: 12px; }
  .card img { width: 60px; height: 90px; object-fit: cover; border-radius: 6px; background: #EAEEF6; }
  .card h3 { font-size: 1rem; margin-bottom: 4px; }
  .card p { color: #4A5578; font-size: 0.9rem; line-height: 1.4; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 Book Search</h1>
  <p class="sub">Search books by title or author using the free Open Library API.</p>
  <div class="controls">
    <input id="query" type="text" placeholder="e.g. Harry Potter, Jane Austen" value="Harry Potter">
    <button id="searchBtn">Search</button>
  </div>
  <div id="status">Click "Search" to find books.</div>
  <div id="books" class="grid"></div>
</div>
<script>
  const statusEl = document.getElementById('status');
  const booksEl = document.getElementById('books');
  const queryEl = document.getElementById('query');

  async function searchBooks() {
    const q = queryEl.value.trim();
    if (!q) { statusEl.textContent = 'Please type a book title or author.'; return; }
    statusEl.className = '';
    statusEl.textContent = 'Searching...';
    booksEl.innerHTML = '';
    try {
      const res = await fetch('https://openlibrary.org/search.json?q=' + encodeURIComponent(q) + '&limit=12');
      const data = await res.json();
      if (!data.docs.length) { statusEl.textContent = 'No books found. Try another search.'; return; }
      statusEl.textContent = data.numFound.toLocaleString() + ' results found. Showing ' + data.docs.length + '.';
      booksEl.innerHTML = data.docs.map(b => {
        const cover = b.cover_i ? 'https://covers.openlibrary.org/b/id/' + b.cover_i + '-M.jpg' : '';
        return '<article class="card">' +
          (cover ? '<img src="' + cover + '" alt="Cover">' : '') +
          '<div><h3>' + (b.title || 'Unknown title') + '</h3>' +
          '<p>' + (b.author_name ? b.author_name.join(', ') : 'Unknown author') + '<br>' +
          'First published: ' + (b.first_publish_year || '—') + '</p></div></article>';
      }).join('');
    } catch (e) {
      statusEl.className = 'error';
      statusEl.textContent = 'Failed to search. Please try again!';
    }
  }

  document.getElementById('searchBtn').addEventListener('click', searchBooks);
  queryEl.addEventListener('keydown', e => { if (e.key === 'Enter') searchBooks(); });
  searchBooks();
</script>
</body>
</html>

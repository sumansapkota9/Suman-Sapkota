<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML5 Validation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #EAEEF6; background-image: radial-gradient(#C9D1E4 1px, transparent 1px); background-size: 22px 22px; color: #0D1633; padding: 24px 16px 48px; }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  p.sub { color: #4A5578; margin-bottom: 18px; }
  form { background: #fff; border-radius: 16px; padding: 22px; }
  label { display: block; font-size: 0.92rem; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; }
  button { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #2F4BFF; color: #fff; font-size: 1rem; cursor: pointer; margin-top: 18px; }
  button:hover { background: #1E33CC; }
  #result { margin-top: 14px; padding: 12px; border-radius: 10px; display: none; background: #dcfce7; color: #166534; }
  .note { font-size: 0.88rem; color: #4A5578; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>✅ HTML5 Validation</h1>
  <p class="sub">This form uses built-in HTML5 validation only. Try submitting it empty or with wrong values.</p>
  <form id="valForm">
    <label for="name">Full name (required, at least 3 letters)</label>
    <input id="name" type="text" required minlength="3" placeholder="Suman Sapkota">
    <label for="email">Email (must be a valid email address)</label>
    <input id="email" type="email" required placeholder="you@example.com">
    <label for="age">Age (between 16 and 100)</label>
    <input id="age" type="number" required min="16" max="100" placeholder="20">
    <label for="phone">Phone (10 digits, numbers only)</label>
    <input id="phone" type="tel" required pattern="[0-9]{10}" placeholder="98XXXXXXXX">
    <label for="site">Website (optional, must start with https://)</label>
    <input id="site" type="url" placeholder="https://example.com">
    <button type="submit">Submit</button>
    <div id="result"></div>
  </form>
  <p class="note">Rules used: required, type="email", type="number" with min/max, minlength, pattern, and type="url". The browser blocks the submit button until every rule passes.</p>
</div>
<script>
  const form = document.getElementById('valForm');
  const result = document.getElementById('result');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    result.style.display = 'block';
    result.textContent = 'All fields are valid! Form submitted (demo only, nothing was sent).';
  });
</script>
</body>
</html>

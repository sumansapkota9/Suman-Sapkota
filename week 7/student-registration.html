<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #EAEEF6; background-image: radial-gradient(#C9D1E4 1px, transparent 1px); background-size: 22px 22px; color: #0D1633; padding: 24px 16px 48px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  p.sub { color: #4A5578; margin-bottom: 18px; }
  form, .summary { background: #fff; border-radius: 16px; padding: 22px; }
  label { display: block; font-size: 0.92rem; margin: 12px 0 4px; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; background: #fff; }
  button { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #2F4BFF; color: #fff; font-size: 1rem; cursor: pointer; margin-top: 18px; }
  button:hover { background: #1E33CC; }
  .summary { display: none; margin-top: 16px; }
  .summary h2 { margin-bottom: 10px; }
  .summary p { line-height: 1.7; color: #4A5578; }
  .summary b { color: #0D1633; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎓 Student Registration</h1>
  <p class="sub">Fill in the form to register a student. A summary card will appear below.</p>
  <form id="regForm">
    <label for="name">Full name</label>
    <input id="name" type="text" required minlength="3" placeholder="Suman Sapkota">
    <label for="sid">Student ID</label>
    <input id="sid" type="text" required placeholder="e.g. 202637609">
    <label for="email">Email</label>
    <input id="email" type="email" required placeholder="you@example.com">
    <label for="program">Program</label>
    <select id="program" required>
      <option value="">Choose a program</option>
      <option>Computer Engineering</option>
      <option>Software Engineering</option>
      <option>Information Technology</option>
      <option>Electronics Engineering</option>
    </select>
    <label for="semester">Semester</label>
    <select id="semester" required>
      <option value="">Choose a semester</option>
      <option>1st Semester</option>
      <option>2nd Semester</option>
      <option>3rd Semester</option>
      <option>4th Semester</option>
    </select>
    <button type="submit">Register Student</button>
  </form>
  <div id="summary" class="summary"></div>
</div>
<script>
  const form = document.getElementById('regForm');
  const summary = document.getElementById('summary');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const sid = document.getElementById('sid').value.trim();
    const email = document.getElementById('email').value.trim();
    const program = document.getElementById('program').value;
    const semester = document.getElementById('semester').value;
    summary.style.display = 'block';
    summary.innerHTML = '<h2>✅ Registration Successful</h2>' +
      '<p><b>Name:</b> ' + name + '<br>' +
      '<b>Student ID:</b> ' + sid + '<br>' +
      '<b>Email:</b> ' + email + '<br>' +
      '<b>Program:</b> ' + program + '<br>' +
      '<b>Semester:</b> ' + semester + '</p>';
    summary.scrollIntoView({ behavior: 'smooth' });
  });
</script>
</body>
</html>

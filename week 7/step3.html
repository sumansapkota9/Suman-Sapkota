<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Search — Step 3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #EAEEF6; color: #0D1633; }
  header { background: #0D1633; color: #fff; padding: 22px 16px; text-align: center; }
  header p { color: #C7D2FE; margin-top: 4px; }
  .wrap { max-width: 700px; margin: 0 auto; padding: 20px 16px; }
  .controls { display: flex; gap: 10px; margin-bottom: 16px; }
  .controls input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; background: #fff; }
  button { padding: 10px 18px; border: 0; border-radius: 10px; background: #2F4BFF; color: #fff; font-size: 1rem; cursor: pointer; }
  button:hover { background: #1E33CC; }
  #status { color: #4A5578; margin: 10px 0; }
</style>
</head>
<body>
<header>
  <h1>Book Search</h1>
  <p>Discover your next favorite book.</p>
</header>
<div class="wrap">
  <form class="controls" id="searchForm">
    <input id="query" type="text" placeholder="Enter a book title or author">
    <button type="submit">Search</button>
  </form>
  <p id="status"></p>
  <h2>Results</h2>
  <p>Search results will appear here.</p>
</div>
<script>
  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const q = document.getElementById('query').value.trim();
    document.getElementById('status').textContent = q ? 'You searched for: ' + q : 'Please type a book title or author.';
  });
</script>
</body>
</html>

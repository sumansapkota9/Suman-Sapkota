<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Form</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #EAEEF6; background-image: radial-gradient(#C9D1E4 1px, transparent 1px); background-size: 22px 22px; color: #0D1633; padding: 24px 16px 48px; }
  .wrap { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; text-align: center; }
  p.sub { color: #4A5578; margin-bottom: 18px; text-align: center; }
  form { background: #fff; border-radius: 16px; padding: 22px; }
  label { display: block; font-size: 0.92rem; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; }
  button { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #2F4BFF; color: #fff; font-size: 1rem; cursor: pointer; margin-top: 18px; }
  button:hover { background: #1E33CC; }
  #msg { margin-top: 14px; padding: 12px; border-radius: 10px; display: none; }
  #msg.ok { display: block; background: #dcfce7; color: #166534; }
  #msg.err { display: block; background: #fee2e2; color: #991b1b; }
  .hint { font-size: 0.85rem; color: #4A5578; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 Login Form</h1>
  <p class="sub">Practice login form. This is a demo only — no real account is checked.</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" required>
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="At least 6 characters" required minlength="6">
    <button type="submit">Login</button>
    <div id="msg"></div>
    <p class="hint">Demo: any valid email + password of 6 or more characters will "log in".</p>
  </form>
</div>
<script>
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email.includes('@') || password.length < 6) {
      msg.className = 'err';
      msg.textContent = 'Please enter a valid email and a password of at least 6 characters.';
      return;
    }
    msg.className = 'ok';
    msg.textContent = 'Welcome! You are logged in as ' + email + ' (demo only).';
  });
</script>
</body>
</html>

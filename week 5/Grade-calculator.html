<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Calculator</title>
<style>
body { font-family: system-ui, sans-serif; background: #EAEEF6; color: #0D1633; padding: 40px 16px; }
.wrap { max-width: 420px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 16px; }
input, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 10px; border: 1px solid #d1d5db; font-size: 1rem; }
button { background: #2F4BFF; color: #fff; border: 0; cursor: pointer; }
#result { margin-top: 16px; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
<h1>Grade Calculator</h1>
<label>Score (0-100)<input id="score" type="number" min="0" max="100"></label>
<button onclick="calc()">Calculate Grade</button>
<p id="result"></p>
</div>
<script>
function calc() {
  const s = Number(document.getElementById('score').value);
  let g = '';
  if (s >= 90) g = 'A';
  else if (s >= 80) g = 'B';
  else if (s >= 70) g = 'C';
  else if (s >= 60) g = 'D';
  else if (s >= 0) g = 'F';
  else g = '';
  document.getElementById('result').textContent = g ? 'Grade: ' + g : 'Enter a score from 0 to 100.';
}
</script>
</body>
</html>

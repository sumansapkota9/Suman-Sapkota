<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loops</title>
<style>
body { font-family: system-ui, sans-serif; background: #EAEEF6; color: #0D1633; padding: 40px 16px; }
.wrap { max-width: 420px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 16px; }
input, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 10px; border: 1px solid #d1d5db; font-size: 1rem; }
button { background: #2F4BFF; color: #fff; border: 0; cursor: pointer; }
#output { margin-top: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
<h1>Loops</h1>
<label>Multiplication table for<input id="num" type="number" value="5"></label>
<button onclick="showTable()">Show Table</button>
<div id="output"></div>
</div>
<script>
function showTable() {
  const n = Number(document.getElementById('num').value);
  let out = '';
  for (let i = 1; i <= 10; i++) {
    out += n + ' x ' + i + ' = ' + (n * i) + '<br>';
  }
  document.getElementById('output').innerHTML = out;
}
showTable();
</script>
</body>
</html>

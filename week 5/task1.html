<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1: My Smart Counter</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #f8fafc;
            --text-main: #0d1633;
            --text-sub: #4a5578;
            --accent: #2f4bff;
            --accent-hover: #1d34d2;
            --danger: #ef4444;
            --border: #c9d1e4;
            --font-family: 'Figtree', system-ui, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem 1rem;
            line-height: 1.6;
        }
        main { max-width: 600px; margin: 0 auto; }
        .task-card {
            background-color: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 1.8rem;
            box-shadow: 0 4px 12px rgba(13, 22, 51, 0.05);
        }
        .task-header h2 { font-size: 1.5rem; color: var(--accent); }
        .tag {
            display: inline-block; background: rgba(47, 75, 255, 0.1);
            color: var(--accent); font-size: 0.8rem; padding: 0.2rem 0.6rem;
            border-radius: 4px; margin-top: 0.3rem; font-weight: 600;
        }
        .desc { color: var(--text-sub); font-size: 0.95rem; margin-top: 0.5rem; }
        .module {
            background-color: #ffffff;
            border: 1.5px solid var(--border);
            border-radius: 8px; padding: 1.2rem; margin-top: 1rem;
        }
        .counter-display { text-align: center; padding: 1.5rem 0; }
        .counter-number { font-size: 3.5rem; font-weight: bold; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
        .counter-controls { display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
        button {
            background-color: var(--accent); color: #fff; border: none;
            padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: background 0.15s; font-family: var(--font-family);
        }
        button:hover { background-color: var(--accent-hover); }
        button.btn-danger { background-color: var(--danger); }
        button.btn-danger:hover { background-color: #dc2626; }
        .text-center { text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>
    <main>
        <section class="task-card">
            <div class="task-header">
                <h2>Task 1: My Smart Counter</h2>
                <span class="tag">Week 5 · JavaScript & localStorage</span>
                <p class="desc">Increase or decrease the counter between -20 and 20. Your count is saved in the browser.</p>
            </div>
            <div class="module">
                <div class="counter-display">
                    <div id="counterVal" class="counter-number">0</div>
                    <p id="counterMsg" class="desc">Your counter is ready!</p>
                </div>
                <div class="counter-controls">
                    <button id="btnDecrement">- Decrease</button>
                    <button id="btnReset" class="btn-danger">Reset</button>
                    <button id="btnIncrement">+ Increase</button>
                </div>
                <p class="desc text-center">Minimum: -20 · Maximum: 20</p>
            </div>
        </section>
    </main>
    <script>
        const MIN_COUNT = -20, MAX_COUNT = 20;
        let count = parseInt(localStorage.getItem('smartCount')) || 0;
        const counterVal = document.getElementById('counterVal');
        const counterMsg = document.getElementById('counterMsg');
        
        function updateCounterDisplay() {
            counterVal.textContent = count;
            localStorage.setItem('smartCount', count);
            if (count === MAX_COUNT) counterMsg.textContent = "Maximum limit reached! (20)";
            else if (count === MIN_COUNT) counterMsg.textContent = "Minimum limit reached! (-20)";
            else counterMsg.textContent = "Your counter is ready!";
        }
        document.getElementById('btnIncrement').addEventListener('click', () => { if (count < MAX_COUNT) { count++; updateCounterDisplay(); } });
        document.getElementById('btnDecrement').addEventListener('click', () => { if (count > MIN_COUNT) { count--; updateCounterDisplay(); } });
        document.getElementById('btnReset').addEventListener('click', () => { count = 0; updateCounterDisplay(); });
        updateCounterDisplay();
    </script>
</body>
</html>

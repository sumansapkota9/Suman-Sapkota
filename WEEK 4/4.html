<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:20px;max-width:420px;margin:auto">
  <style>
    h2 { color: #1a56db; }
    #search { width:100%; padding:10px 14px; font-size:16px;
      border:2px solid #1a56db; border-radius:10px; margin-bottom:14px; }
    .student { padding:10px 14px; margin-bottom:6px; background:#f0f4ff;
      border-radius:8px; border:1px solid #c8d4f0; font-size:15px; }
    mark { background: #f7df1e; border-radius: 3px; }
    #no-results { display:none; color:#9ca3af; text-align:center; padding:20px; }
  </style>

  <h2>Student Search</h2>
  <input id="search" type="text" placeholder="Search students...">

  <div id="student-list">
    <div class="student" data-name="Kim Jisoo">Kim Jisoo — Web Programming</div>
    <div class="student" data-name="Park Minjun">Park Minjun — Computer Science</div>
    <div class="student" data-name="Lee Sooyeon">Lee Sooyeon — Software Engineering</div>
    <div class="student" data-name="Choi Hyunwoo">Choi Hyunwoo — Artificial Intelligence</div>
    <div class="student" data-name="Jung Yuna">Jung Yuna — Data Science</div>
    <div class="student" data-name="Kang Seojun">Kang Seojun — Web Programming</div>
  </div>

  <p id="no-results">No students found.</p>

  <script>
    
    const search = document.querySelector("#search");
    const students = document.querySelectorAll(".student");
    const noResults = document.querySelector("#no-results");

    
    search.addEventListener("input", function(e) {

      
      const term = e.target.value.toLowerCase();

      let found = 0;

      
      students.forEach(function(student) {

        const name = student.getAttribute("data-name");
        const lowerName = name.toLowerCase();

       
        if (lowerName.includes(term)) {
          student.style.display = "";

          
          if (term !== "") {
            const regex = new RegExp("(" + term + ")", "gi");
            student.innerHTML = student.textContent.replace(
              regex,
              "<mark>$1</mark>"
            );
          } else {
            student.innerHTML = student.textContent;
          }

          found++;
        } else {
          student.style.display = "none";
        }
      });

      if (found === 0) {
        noResults.style.display = "block";
      } else {
        noResults.style.display = "none";
      }
    });
  </script>

</body></html>

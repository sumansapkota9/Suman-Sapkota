<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hover Lift Card</title>
  <style>
    body { 
      padding: 40px; 
      background: #f0fdfa; 
      font-family: system-ui, -apple-system, sans-serif;
    }

    .card {
      background: white;
      border: 2px solid #14b8a6;
      border-radius: 12px;
      padding: 24px;
      width: 240px;
      color: #0f766e;
      font-size: 16px;
      box-shadow: 0 0 0 rgba(20, 184, 166, 0);
      /* Transition defined on base element so it plays on enter AND exit */
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 20px -4px rgba(20, 184, 166, 0.35);
    }
  </style>
</head>
<body>

  <div class="card">Hover over me!</div>

</body>
</html>

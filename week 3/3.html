<!DOCTYPE html>
<html>
<head>
  <title>Color Swatches</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .swatch-container {
      display: flex;       
      gap: 12px;           
    }

    .swatch {
      width: 100px;
      height: 100px;
      border-radius: 8px;  
      color: white;        
      font-weight: bold;   
      
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .swatch-1 { background-color: #ef4444; }
    .swatch-2 { background-color: #3b82f6; }
    .swatch-3 { background-color: #10b981; }
    .swatch-4 { background-color: #f59e0b; }
    .swatch-5 { background-color: #8b5cf6; }
  </style>
</head>
<body>

  <h2>Color Swatches</h2>

  <div class="swatch-container">
    <div class="swatch swatch-1">#ef4444</div>
    <div class="swatch swatch-2">#3b82f6</div>
    <div class="swatch swatch-3">#10b981</div>
    <div class="swatch swatch-4">#f59e0b</div>
    <div class="swatch swatch-5">#8b5cf6</div>
  </div>

</body>
</html>

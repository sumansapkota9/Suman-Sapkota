<!DOCTYPE html>
<html>
<head>
  <title>css project 4</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f8fafc;
    }

    .margin-box {
      background-color: #f59e0b;
      padding: 20px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      text-align: center;
    }

    .border-box {
      background-color: #475569;
      padding: 20px;
      border-radius: 6px;
    }

    .padding-box {
      background-color: #0ea5e9;
      padding: 20px;
      border-radius: 4px;
    }

    .content-box {
      background-color: #8b5cf6;
      padding: 20px 40px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="margin-box">
    MARGIN
    <div class="border-box">
      BORDER
      <div class="padding-box">
        PADDING
        <div class="content-box">
          CONTENT
        </div>
      </div>
    </div>
  </div>

</body>
</html>

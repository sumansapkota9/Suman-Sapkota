<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My CSS Portfolio</title>

  <style>
    /* 1. Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 2. Base styles */
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    a {
      text-decoration: none;
    }

    h1, h2, h3 {
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
    }

    /* 3. Navigation */
    .nav {
      background: #1e293b;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
    }

    .nav-logo {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
    }

    .nav-links a:hover {
      color: #10B981;
    }

    /* 4. Hero section */
    .hero {
      text-align: center;
      padding: 70px 20px;
      background: white;
    }

    .hero h1 {
      font-size: 2.5rem;
    }

    .hero p {
      color: #666;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      background: #10B981;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
    }

    /* 5. Skills grid */
    .skills-section {
      padding: 50px 30px;
      text-align: center;
    }

    .skills-grid {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 25px;
    }

    .skill-card {
      background: white;
      padding: 25px;
      width: 30%;
      border-radius: 8px;
    }

    .skill-card p {
      color: #666;
    }

    /* 6. Footer */
    .footer {
      background: #1e293b;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <nav class="nav">
    <span class="nav-logo">MyPortfolio</span>

    <div class="nav-links">
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Hello, I am Learning CSS!</h1>
    <p>Week 3 · CSS Introduction · Gachon University</p>
    <a href="#skills" class="btn">See My Skills</a>
  </section>

  <section class="skills-section" id="skills">
    <h2>What I Know</h2>

    <div class="skills-grid">
      <div class="skill-card">
        <h3>HTML5</h3>
        <p>Structure and semantics</p>
      </div>

      <div class="skill-card">
        <h3>CSS3</h3>
        <p>Styling and layout</p>
      </div>

      <div class="skill-card">
        <h3>Flexbox</h3>
        <p>Modern layout model</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>K0126002 Web Programming &copy; 2026 Gachon University</p>
  </footer>

</body>
</html>

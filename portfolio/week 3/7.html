<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background: #f1f5f9;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      width: 320px;
      padding: 25px;
      text-align: center;
      border-radius: 10px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      background: #10B981;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 15px;
      font-size: 2rem;
      font-weight: bold;
    }

    .name {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .role {
      color: #6b7280;
      margin-bottom: 20px;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin-bottom: 20px;
    }

    .skills {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      background: #10B981;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">K</div>
    <h2 class="name">Kim Jisoo</h2>
    <p class="role">Web Programming Student</p>
    <hr>
    <div class="skills">
      <span class="badge">HTML5</span>
      <span class="badge">CSS3</span>
      <span class="badge">Flexbox</span>
    </div>
  </div>
</body>
</html>

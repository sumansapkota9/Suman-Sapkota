<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Responsive Grid Skills</title>
  <style>
    :root {
      --primary: #0f766e;
      --accent: #14b8a6;
      --bg: #f0fdfa;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #ccfbf1;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 12px 20px -4px rgba(20, 184, 166, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #14b8a6;
        --accent: #2dd4bf;
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --border: #334155;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        --shadow-hover: 0 12px 20px -4px rgba(20, 184, 166, 0.3);
      }
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1 {
      text-align: center;
      margin-bottom: 32px;
      color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent);
    }

    .card[data-icon]::before {
      content: attr(data-icon);
      font-size: 2rem;
      display: block;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <h1>My Skills</h1>
  <div class="grid">
    <div class="card" data-icon="🌐">HTML5 — Structure</div>
    <div class="card" data-icon="🎨">CSS3 — Styling</div>
    <div class="card" data-icon="⚡">JavaScript — Behaviour</div>
    <div class="card" data-icon="📐">Flexbox — 1D Layout</div>
    <div class="card" data-icon="🗂">Grid — 2D Layout</div>
    <div class="card" data-icon="📱">Responsive — Any Screen</div>
  </div>

</body>
</html>

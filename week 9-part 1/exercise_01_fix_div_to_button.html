<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fix a div-button to a real button</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #fff; color: #111827; }
  .wrap { max-width: 500px; margin: 0 auto; padding: 48px 20px; text-align: center; }
  h1 { color: #1e293b; font-size: 30px; margin: 0 0 12px; }
  p { color: #555; }
  .buttons { display: flex; gap: 16px; justify-content: center; margin: 28px 0 20px; }
  button { cursor: pointer; border: none; color: #fff; font-size: 16px; font-weight: bold; }
  button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  #submitBtn { background: #22c55e; border-radius: 8px; padding: 12px 24px; }
  #submitBtn:hover { background: #16a34a; }
  #closeBtn {
    background: #ef4444; border-radius: 50%;
    width: 48px; height: 48px; font-size: 20px; line-height: 1;
  }
  #closeBtn:hover { background: #dc2626; }
  #status { color: #6b7280; font-size: 14px; min-height: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fix the div-button</h1>
  <p>Press Tab, then Enter or Space:</p>
  <div class="buttons">
    <button id="submitBtn" type="button">Submit form</button>
    <button id="closeBtn" type="button" aria-label="Close">✕</button>
  </div>
  <p id="status" role="status"></p>
</div>

<script>
const statusEl = document.getElementById('status');
document.getElementById('submitBtn').addEventListener('click', () => {
  statusEl.textContent = '✅ Submit activated — works by keyboard and mouse';
});
document.getElementById('closeBtn').addEventListener('click', () => {
  statusEl.textContent = '✅ Close activated — announced as "Close, button"';
});
</script>
</body>
</html>

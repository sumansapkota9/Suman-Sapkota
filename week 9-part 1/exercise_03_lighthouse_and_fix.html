<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Lighthouse &amp; Fix Issues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#EAEEF6; --ink:#0D1633; --ink-2:#4A5578; --line:#C9D1E4; --cobalt:#2F4BFF; --sun:#FFC933; --white:#fff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Figtree",system-ui,sans-serif; background:var(--paper); background-image:radial-gradient(#C9D1E4 1px, transparent 1px); background-size:22px 22px; color:var(--ink); padding:40px 16px 48px; }
  .wrap { max-width:420px; margin:0 auto; background:var(--white); border:1px solid var(--line); border-radius:16px; padding:28px 24px; }
  h1 { font-family:"Bricolage Grotesque",sans-serif; font-size:30px; margin:0 0 24px; }
  h1 span { color:var(--cobalt); }
  .search-row { display:flex; justify-content:flex-end; margin-bottom:16px; }
  #searchBtn {
    background:#22c55e; color:#fff; border:none; border-radius:50%;
    width:44px; height:44px; font-size:20px; cursor:pointer;
  }
  label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
  input {
    width:100%; padding:11px 12px; font-size:15px; font-family:"Figtree",sans-serif;
    border:1px solid var(--line); border-radius:8px; box-sizing:border-box;
  }
  .field { margin-bottom:18px; }
  .error { color:#dc2626; font-size:13px; margin:6px 0 0; }
  button[type="submit"] {
    width:100%; height:46px; background:var(--cobalt); color:#fff;
    border:none; border-radius:999px; font-size:16px; font-weight:600; cursor:pointer; font-family:"Figtree",sans-serif;
  }
  button[type="submit"]:hover { background:#1e3ad6; }
  .team { margin-top:24px; font-size:15px; }
  .team a { color:var(--cobalt); }
  .team img { vertical-align:middle; margin-right:6px; }
</style>
</head>
<body>
<main class="wrap">
  <h1>Create your <span>account</span></h1>

  <!-- Fixed version: the only change is the <main> landmark below.
       Before: Lighthouse Accessibility 98 — "Document does not have a main landmark".
       After this fix the page scores 100. The other demo quirks
       (icon-only button, errors shown before any input, broken image)
       are left as they were. -->
  <form>
    <div class="search-row">
      <button id="searchBtn" type="button" aria-label="Search">🔍</button>
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="text" placeholder="you@example.com">
      <p class="error">⚠️ Please enter a valid email address.</p>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password">
      <p class="error">⚠️ Password must be at least 8 characters.</p>
    </div>

    <button type="submit">Create account</button>
  </form>

  <p class="team">
    <a href="#">
      <img src="mentors.jpg" alt="Photo of our mentors" width="80" height="40">
      Meet the guide team
    </a>
  </p>
</main>
</body>
</html>

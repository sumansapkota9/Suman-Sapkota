<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #EAEEF6; background-image: radial-gradient(#C9D1E4 1px, transparent 1px); background-size: 22px 22px; color: #0D1633; padding: 24px 16px 48px; display: flex; justify-content: center; }
  .wrap { width: 100%; max-width: 420px; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; text-align: center; }
  p.sub { color: #4A5578; margin-bottom: 18px; text-align: center; }
  form { background: #fff; border-radius: 16px; padding: 22px; }
  label { display: block; font-size: 0.92rem; margin: 12px 0 4px; }
  input[type="email"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; }
  .remember { margin-top: 14px; font-size: 0.92rem; }
  .remember input { width: auto; }
  button { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #2F4BFF; color: #fff; font-size: 1rem; cursor: pointer; margin-top: 18px; }
  button:hover { background: #1E33CC; }
  #msg { margin-top: 14px; padding: 12px; border-radius: 10px; display: none; background: #dcfce7; color: #166534; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sign In</h1>
  <p class="sub">Demo sign-in card. No real account is checked.</p>
  <form id="loginForm">
    <label for="email">Email Address</label>
    <input id="email" type="email" required placeholder="you@example.com">
    <label for="password">Password</label>
    <input id="password" type="password" required placeholder="********">
    <label class="remember"><input id="remember" type="checkbox"> Remember me</label>
    <button type="submit">Sign In</button>
    <div id="msg"></div>
  </form>
</div>
<script>
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.style.display = 'block';
    msg.textContent = 'Welcome back! You signed in as ' + document.getElementById('email').value.trim() +
      (document.getElementById('remember').checked ? ' (remembered on this device).' : ' (demo only).');
  });
</script>
</body>
</html>

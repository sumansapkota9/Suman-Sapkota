<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Me</title>
<style>
  body { font-family: Arial, sans-serif; background: #e8edf3; color: #111827; margin: 0; }
  .card {
    max-width: 460px; margin: 40px auto; padding: 30px;
    background: #fff; border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  }
  h1 { font-size: 28px; color: #0f172a; margin: 0 0 8px; }
  .intro { color: #64748b; margin: 0 0 24px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 14px; font-weight: bold; color: #1e293b; margin-bottom: 6px; }
  label .hint { font-weight: normal; color: #94a3b8; font-size: 13px; }
  input, textarea {
    width: 100%; padding: 12px; font-size: 15px; font-family: inherit;
    border: 1.5px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;
    background: #fff;
  }
  input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
  textarea { min-height: 130px; resize: vertical; }
  input.valid, textarea.valid { border-color: #22c55e; background: #f0fdf4; }
  input.invalid, textarea.invalid { border-color: #ef4444; background: #fef2f2; }
  .error { display: none; color: #dc2626; font-size: 13px; margin: 6px 0 0; }
  .error.show { display: block; }
  .counter { text-align: right; color: #94a3b8; font-size: 13px; margin: 6px 0 0; }
  button {
    width: 100%; height: 48px; background: #2563eb; color: #fff;
    border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  #success { display: none; margin-top: 16px; padding: 12px; border-radius: 8px;
    background: #dcfce7; color: #166534; font-size: 15px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>Contact Me</h1>
  <p class="intro">Have a question or want to work together? Send me a message.</p>

  <form id="contactForm">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="Your name"
             pattern="[A-Za-z][A-Za-z \-]*" minlength="2" required>
      <p class="error" id="nameError">Please enter at least 2 letters.</p>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="name@example.com" required>
      <p class="error" id="emailError">Please enter a valid email address.</p>
    </div>

    <div class="field">
      <label for="subject">Subject</label>
      <input id="subject" name="subject" type="text" placeholder="What is this about?"
             minlength="3" required>
      <p class="error" id="subjectError">The subject needs at least 3 characters.</p>
    </div>

    <div class="field">
      <label for="message">Message <span class="hint">(20–1000 characters)</span></label>
      <textarea id="message" name="message" placeholder="Type your message here..."
                minlength="20" maxlength="1000" rows="6" required></textarea>
      <p class="counter"><span id="count">0</span> / 1000</p>
      <p class="error" id="messageError">Your message needs at least 20 characters.</p>
    </div>

    <button type="submit">Send Message</button>
  </form>
  <p id="success">Thanks! Your message has been sent.</p>
</div>

<script>
const form = document.getElementById('contactForm');
const successEl = document.getElementById('success');
const countEl = document.getElementById('count');

const fields = [
  { input: document.getElementById('name'), error: document.getElementById('nameError') },
  { input: document.getElementById('email'), error: document.getElementById('emailError') },
  { input: document.getElementById('subject'), error: document.getElementById('subjectError') },
  { input: document.getElementById('message'), error: document.getElementById('messageError') },
];

function validateField(f, showError) {
  const ok = f.input.checkValidity();
  f.input.classList.toggle('valid', ok && f.input.value !== '');
  f.input.classList.toggle('invalid', showError && !ok);
  f.error.classList.toggle('show', showError && !ok);
  return ok;
}

fields.forEach(f => {
  f.input.addEventListener('input', () => {
    validateField(f, true);
    if (f.input.id === 'message') countEl.textContent = f.input.value.length;
  });
});

form.addEventListener('submit', e => {
  e.preventDefault();
  // Native validation runs first: if any field is invalid the browser shows
  // its own bubble and this handler never fires. Here every field is valid.
  form.reset();
  countEl.textContent = '0';
  fields.forEach(f => f.input.classList.remove('valid', 'invalid'));
  successEl.style.display = 'block';
});

// If the user tries to submit with empty/invalid fields, the browser shows
// its native bubble — and we also paint every field red/green at once.
// (Do NOT preventDefault here: cancelling the invalid event would hide
// the browser's own "Please fill out this field." bubble.)
form.addEventListener('invalid', () => {
  fields.forEach(f => validateField(f, true));
}, true);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get in Touch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#EAEEF6; --ink:#0D1633; --ink-2:#4A5578; --line:#C9D1E4; --cobalt:#2F4BFF; --sun:#FFC933; --white:#fff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Figtree",system-ui,sans-serif; background:var(--paper); background-image:radial-gradient(#C9D1E4 1px, transparent 1px); background-size:22px 22px; color:var(--ink); padding:40px 16px 48px; }
  .card {
    max-width:480px; margin:0 auto; padding:28px 26px;
    background:var(--white); border:1px solid var(--line); border-radius:16px;
  }
  h1 { font-family:"Bricolage Grotesque",sans-serif; font-size:30px; margin:0 0 8px; }
  h1 span { color:var(--cobalt); }
  .intro { color:var(--ink-2); margin:0 0 24px; line-height:1.6; }
  .field { margin-bottom:18px; }
  label { display:block; font-size:14px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  label .hint { font-weight:400; color:var(--ink-2); font-size:13px; }
  input, textarea {
    width:100%; padding:12px; font-size:15px; font-family:inherit;
    border:1.5px solid var(--line); border-radius:8px; box-sizing:border-box;
    background:#fff; color:var(--ink);
  }
  input:focus, textarea:focus { outline:none; border-color:var(--cobalt); box-shadow:0 0 0 3px rgba(47, 75, 255, 0.15); }
  textarea { min-height:130px; resize:vertical; }
  input.valid, textarea.valid { border-color:#22c55e; background:#f0fdf4; }
  input.invalid, textarea.invalid { border-color:#ef4444; background:#fef2f2; }
  .error { display:none; color:#dc2626; font-size:13px; margin:6px 0 0; }
  .error.show { display:block; }
  .counter { text-align:right; color:var(--ink-2); font-size:13px; margin:6px 0 0; }
  button {
    width:100%; height:48px; background:var(--cobalt); color:#fff;
    border:none; border-radius:999px; font-size:16px; font-weight:600; cursor:pointer; font-family:"Figtree",sans-serif;
  }
  button:hover { background:#1e3ad6; }
  #success { display:none; margin-top:16px; padding:12px; border-radius:8px;
    background:#dcfce7; color:#166534; font-size:15px; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <h1>Get in <span>Touch</span></h1>
  <p class="intro">Questions about the Student Guide, or just want to say hello? Drop a note below.</p>

  <form id="contactForm">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="e.g. Suman Sapkota"
             pattern="[A-Za-z][A-Za-z \-]*" minlength="2" required>
      <p class="error" id="nameError">Name needs at least 2 letters.</p>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required>
      <p class="error" id="emailError">That email address doesn't look right.</p>
    </div>

    <div class="field">
      <label for="subject">Subject</label>
      <input id="subject" name="subject" type="text" placeholder="e.g. Roommate splitter question"
             minlength="3" required>
      <p class="error" id="subjectError">Subject needs at least 3 characters.</p>
    </div>

    <div class="field">
      <label for="message">Message <span class="hint">(20–1000 characters)</span></label>
      <textarea id="message" name="message" placeholder="Write your message here..."
                minlength="20" maxlength="1000" rows="6" required></textarea>
      <p class="counter"><span id="count">0</span> / 1000</p>
      <p class="error" id="messageError">Message needs at least 20 characters.</p>
    </div>

    <button type="submit">Send it</button>
  </form>
  <p id="success">Got it — your message is on its way. Thanks!</p>
</div>

<script>
const form = document.getElementById('contactForm');
const successEl = document.getElementById('success');
const countEl = document.getElementById('count');

const fields = [
  { input: document.getElementById('name'), error: document.getElementById('nameError') },
  { input: document.getElementById('email'), error: document.getElementById('emailError') },
  { input: document.getElementById('subject'), error: document.getElementById('subjectError') },
  { input: document.getElementById('message'), error: document.getElementById('messageError') },
];

function validateField(f, showError) {
  const ok = f.input.checkValidity();
  f.input.classList.toggle('valid', ok && f.input.value !== '');
  f.input.classList.toggle('invalid', showError && !ok);
  f.error.classList.toggle('show', showError && !ok);
  return ok;
}

fields.forEach(f => {
  f.input.addEventListener('input', () => {
    validateField(f, true);
    if (f.input.id === 'message') countEl.textContent = f.input.value.length;
  });
});

form.addEventListener('submit', e => {
  e.preventDefault();
  // Native validation runs first: if any field is invalid the browser shows
  // its own bubble and this handler never fires. Here every field is valid.
  form.reset();
  countEl.textContent = '0';
  fields.forEach(f => f.input.classList.remove('valid', 'invalid'));
  successEl.style.display = 'block';
});

// If the user tries to submit with empty/invalid fields, the browser shows
// its native bubble — and we also paint every field red/green at once.
// (Do NOT preventDefault here: cancelling the invalid event would hide
// the browser's own "Please fill out this field." bubble.)
form.addEventListener('invalid', () => {
  fields.forEach(f => validateField(f, true));
}, true);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #EAEEF6; background-image: radial-gradient(#C9D1E4 1px, transparent 1px); background-size: 22px 22px; color: #0D1633; padding: 24px 16px 48px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  p.sub { color: #4A5578; margin-bottom: 18px; }
  form { background: #fff; border-radius: 16px; padding: 22px; }
  h2 { font-size: 1.1rem; margin: 18px 0 4px; }
  h2:first-child { margin-top: 0; }
  label { display: block; font-size: 0.92rem; margin: 12px 0 4px; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; background: #fff; }
  input[type="range"] { padding: 0; }
  input[type="checkbox"] { width: auto; }
  button { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #2F4BFF; color: #fff; font-size: 1rem; cursor: pointer; margin-top: 18px; }
  button:hover { background: #1E33CC; }
  #msg { margin-top: 14px; padding: 12px; border-radius: 10px; display: none; background: #dcfce7; color: #166534; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Student Registration</h1>
  <p class="sub">Register a student with personal and account information.</p>
  <form id="regForm">
    <h2>Personal Info</h2>
    <label for="name">Full Name</label>
    <input id="name" type="text" required minlength="3" placeholder="Suman Sapkota">
    <label for="sid">Student ID (exactly 9 digits)</label>
    <input id="sid" type="text" required pattern="[0-9]{9}" placeholder="e.g. 202637609">
    <label for="dob">Date of Birth</label>
    <input id="dob" type="date" required>
    <label for="major">Major</label>
    <select id="major" required>
      <option value="">Choose a major</option>
      <option>Computer Engineering</option>
      <option>Software Engineering</option>
      <option>Business Administration</option>
      <option>Electrical Engineering</option>
      <option>Artificial Intelligence</option>
    </select>
    <h2>Account Info</h2>
    <label for="email">Email</label>
    <input id="email" type="email" required placeholder="you@example.com">
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" type="password" required minlength="8" placeholder="********">
    <label for="phone">Phone (010-1234-5678 format)</label>
    <input id="phone" type="tel" required pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}" placeholder="010-1234-5678">
    <label for="years">Years of Coding Experience: <span id="yearsVal">0 years</span></label>
    <input id="years" type="range" min="0" max="10" value="0">
    <label><input id="terms" type="checkbox" required> I agree to the terms</label>
    <button type="submit">Register Now</button>
    <div id="msg"></div>
  </form>
</div>
<script>
  const years = document.getElementById('years');
  const yearsVal = document.getElementById('yearsVal');
  years.addEventListener('input', () => { yearsVal.textContent = years.value + ' years'; });
  const form = document.getElementById('regForm');
  const msg = document.getElementById('msg');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.style.display = 'block';
    msg.textContent = 'Registration successful! Welcome, ' + document.getElementById('name').value.trim() +
      ' (' + document.getElementById('major').value + ', ' + years.value + ' years of coding experience).';
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 11 Monday Submission | Suman Sapkota</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#EAEEF6; --ink:#0D1633; --ink2:#4A5578; --line:#C9D1E4;
         --cobalt:#2F4BFF; --sun:#FFC933; --card:#fff; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Figtree',sans-serif; line-height:1.6;
        background-image:radial-gradient(#C9D1E4 1px, transparent 1px); background-size:22px 22px; }
  header{ background:var(--ink); color:#fff; padding:28px 20px; }
  header h1{ font-family:'Bricolage Grotesque',sans-serif; margin:0 0 6px; font-size:28px; }
  header p{ margin:2px 0; color:#C7D2FE; }
  .wrap{ max-width:820px; margin:0 auto; padding:20px; }
  section{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin:16px 0; }
  h2{ font-family:'Bricolage Grotesque',sans-serif; margin-top:0; }
  h2 span{ background:var(--sun); padding:2px 8px; border-radius:8px; font-size:14px; vertical-align:middle; }
  h3{ margin:18px 0 6px; }
  button{ background:var(--cobalt); color:#fff; border:0; border-radius:10px; padding:8px 14px; font-size:15px; cursor:pointer; margin:4px 6px 4px 0; }
  button.ghost{ background:#fff; color:var(--ink); border:1px solid var(--line); }
  button.active{ outline:2px solid var(--sun); }
  input, textarea{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-size:15px; margin:4px 0; font-family:inherit; }
  .card{ border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; }
  .card b{ font-family:'Bricolage Grotesque',sans-serif; font-size:18px; }
  .ok{ color:#15803d; font-weight:600; } .no{ color:#b91c1c; font-weight:600; }
  .big{ font-size:32px; font-weight:700; }
  code{ font-family:'JetBrains Mono',monospace; background:var(--paper); padding:2px 6px; border-radius:6px; }
  label{ display:block; margin:8px 0; }
  footer{ color:var(--ink2); font-size:14px; text-align:center; padding:10px 0 30px; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <p>WEEK 11 / MONDAY / REACT</p>
    <h1>Week 11 Monday Submission</h1>
    <p>Suman Sapkota · 202637609 · Computer Engineering</p>
    <p>Practice JSX and props, then build on those basics with seven state and event exercises.</p>
  </div>
</header>
<main class="wrap"><div id="root"></div><noscript>Yo page chaluna JavaScript on garnus.</noscript></main>
<footer>Suman Sapkota · Week 11 Monday · React — afno style ma, Sudip ko structure anusar, copy hoina.</footer>
<script type="text/babel">
// Suman ko note:
// Component = function jasle UI return garcha. Props = bahira bata dine data.
// useState = value rakhne + badalne. useEffect = side effect, e.g. localStorage ma save garne.
const { useState, useEffect } = React;

function StudentCard({ name, id, major }) {
  return (<div className="card"><b>{name}</b><p>ID: {id}</p><p>Major: {major}</p></div>);
}

const QUESTIONS = [
  { q: "React k ho?", options: ["JavaScript library — UI banaune", "Database", "Operating system"], answer: 0 },
  { q: "Valid functional component kun ho?", options: ["function StudentCard() { return <div/> }", "function studentcard() { return <div/> }", "StudentCard = 'card'"], answer: 0 },
  { q: "Props bata count kasari padhne?", options: ["function Card({ count }) { return count }", "function Card() { return count }", "count = props"], answer: 0 },
];

function Quiz() {
  const [picked, setPicked] = useState([null, null, null]);
  const score = picked.filter((p, i) => p === QUESTIONS[i].answer).length;
  return (
    <section><h2>01 · React foundations <span>Quiz</span></h2>
      <p>Practice score: <b>{score} / 3</b></p>
      {QUESTIONS.map((item, i) => (
        <div key={i} style={{ marginBottom: 14 }}>
          <p><b>{i + 1}. {item.q}</b></p>
          {item.options.map((opt, j) => (
            <button key={j} className="ghost" onClick={() => { const n = [...picked]; n[i] = j; setPicked(n); }}>{opt}</button>
          ))}
          {picked[i] !== null && <p className={picked[i] === item.answer ? "ok" : "no"}>{picked[i] === item.answer ? "✓ Mil yo!" : "✗ Milena — feri try gara."}</p>}
        </div>
      ))}
    </section>
  );
}

function StateLab() {
  const [count, setCount] = useState(0);
  const [session, setSession] = useState("");
  const [queue, setQueue] = useState(["React props", "useState"]);
  const [newItem, setNewItem] = useState("");
  const [showTip, setShowTip] = useState(false);
  const [tasks, setTasks] = useState([
    { text: "Quiz sakne", done: true }, { text: "StudentCard banaune", done: true }, { text: "7 exercise sakne", done: false },
  ]);
  const [filter, setFilter] = useState("All");
  const shown = tasks.filter(t => filter === "All" || (filter === "Done" ? t.done : !t.done));
  const [profile, setProfile] = useState({ name: "Suman Sapkota", email: "" });
  const [profileMsg, setProfileMsg] = useState("");
  const [note, setNote] = useState(() => localStorage.getItem("suman-week11-note") || "");
  useEffect(() => { localStorage.setItem("suman-week11-note", note); }, [note]);

  return (
    <section><h2>03 · React State &amp; Events <span>7 exercises</span></h2>
      <p>Seven interactive exercises covering counters, inputs, lists, forms and browser storage.</p>

      <h3>1. Count practice rounds</h3>
      <p className="big">{count}</p>
      <button onClick={() => setCount(count + 1)}>+ Add</button>
      <button className="ghost" onClick={() => setCount(count - 1)}>− Minus</button>
      <button className="ghost" onClick={() => setCount(0)}>Reset</button>

      <h3>2. Name your session</h3>
      <input value={session} onChange={e => setSession(e.target.value)} placeholder="e.g. React Monday practice" />
      <p>Session: <b>{session || "—"}</b></p>

      <h3>3. Study queue</h3>
      <input value={newItem} onChange={e => setNewItem(e.target.value)} placeholder="Add a topic" />
      <button onClick={() => { if (newItem.trim()) { setQueue([...queue, newItem.trim()]); setNewItem(""); } }}>Add</button>
      <ul>{queue.map((q, i) => (
        <li key={i}>{q} <button className="ghost" onClick={() => setQueue(queue.filter((_, j) => j !== i))}>Remove</button></li>
      ))}</ul>

      <h3>4. Quick React tip</h3>
      <button onClick={() => setShowTip(!showTip)}>{showTip ? "Hide tip" : "Show tip"}</button>
      {showTip && <p>Tip: <code>useState</code> le value ra state badalne function dincha — UI afai update huncha.</p>}

      <h3>5. Submission checklist</h3>
      <button className={filter === "All" ? "active" : "ghost"} onClick={() => setFilter("All")}>All</button>
      <button className={filter === "Active" ? "active" : "ghost"} onClick={() => setFilter("Active")}>Active</button>
      <button className={filter === "Done" ? "active" : "ghost"} onClick={() => setFilter("Done")}>Done</button>
      {shown.map((t, i) => (
        <label key={i}><input type="checkbox" checked={t.done} style={{ width: "auto" }}
          onChange={() => setTasks(tasks.map(x => x === t ? { ...x, done: !x.done } : x))} /> {t.text}</label>
      ))}

      <h3>6. Check your lab profile</h3>
      <input value={profile.name} onChange={e => setProfile({ ...profile, name: e.target.value })} placeholder="Name" />
      <input value={profile.email} onChange={e => setProfile({ ...profile, email: e.target.value })} placeholder="Email" />
      <button onClick={() => setProfileMsg(profile.email.includes("@") ? "✓ Profile OK: " + profile.name : "✗ Email ma @ chahinxa.")}>Check profile</button>
      <p className={profileMsg.startsWith("✓") ? "ok" : "no"}>{profileMsg}</p>

      <h3>7. Leave yourself a note</h3>
      <textarea value={note} onChange={e => setNote(e.target.value)} placeholder="e.g. React ma props bujhe — useEffect localStorage ma save garcha" rows="3" />
      <p>Note save bhayo — page refresh garepachi pani rahanchha (localStorage).</p>
    </section>
  );
}

function App() {
  return (
    <div>
      <Quiz />
      <section><h2>02 · StudentCard <span>Props</span></h2>
        <p>A functional component receives name, id, and major as props and renders my student profile.</p>
        <StudentCard name="Suman Sapkota" id="202637609" major="Computer Engineering" />
      </section>
      <StateLab />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

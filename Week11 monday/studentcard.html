<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudentCard | Suman Sapkota</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#EAEEF6; --ink:#0D1633; --ink2:#4A5578; --line:#C9D1E4; --cobalt:#2F4BFF; --sun:#FFC933; --card:#fff; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Figtree',sans-serif; line-height:1.6; background-image:radial-gradient(#C9D1E4 1px, transparent 1px); background-size:22px 22px; }
  header{ background:var(--ink); color:#fff; padding:28px 20px; }
  header h1{ font-family:'Bricolage Grotesque',sans-serif; margin:0 0 6px; font-size:28px; }
  header p{ margin:2px 0; color:#C7D2FE; }
  .wrap{ max-width:820px; margin:0 auto; padding:20px; }
  section{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin:16px 0; }
  h2{ font-family:'Bricolage Grotesque',sans-serif; margin-top:0; }
  .card{ border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; }
  .card b{ font-family:'Bricolage Grotesque',sans-serif; font-size:18px; }
  code{ font-family:'JetBrains Mono',monospace; background:var(--paper); padding:2px 6px; border-radius:6px; }
  pre{ background:#0A1129; color:#C7D2FE; padding:14px; border-radius:12px; overflow-x:auto; }
  a.back{ color:var(--cobalt); }
  footer{ color:var(--ink2); font-size:14px; text-align:center; padding:10px 0 30px; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <p>Week 11 Monday / First component</p>
    <h1>A card made from props.</h1>
    <p>Suman Sapkota · 202637609 · Computer Engineering</p>
  </div>
</header>
<main class="wrap">
  <p><a class="back" href="index.html">← Back to Week 11 Monday</a></p>
  <div id="root"></div>
  <noscript>Yo page chaluna JavaScript on garnus.</noscript>
</main>
<footer>Suman Sapkota · Week 11 Monday · StudentCard with props.</footer>
<script type="text/babel">
// Suman ko note:
// Component = function jasle UI return garcha.
// Props = component lai bahira bata dine data — yaha name, id, major.
// App le data pathauxa, StudentCard le dekhaunxa.
function StudentCard({ name, id, major }) {
  return (<div className="card"><b>{name}</b><p>ID: {id}</p><p>Major: {major}</p></div>);
}
function App() {
  return (
    <div>
      <section>
        <h2>StudentCard lab result</h2>
        <StudentCard name="Suman Sapkota" id="202637609" major="Computer Engineering" />
      </section>
      <section>
        <h2>How the data gets here</h2>
        <p>The App sends my details down, and StudentCard shows them with JSX. It takes three props that it only reads, never changes: name, id, and major.</p>
        <pre>{'<StudentCard name="Suman Sapkota" id="202637609" major="Computer Engineering" />'}</pre>
      </section>
      <p><a className="back" href="index.html">Back to Monday tasks →</a></p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #EAEEF6; background-image: radial-gradient(#C9D1E4 1px, transparent 1px); background-size: 22px 22px; color: #0D1633; padding: 24px 16px 48px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; text-align: center; }
  p.sub { color: #4A5578; margin-bottom: 18px; text-align: center; }
  form { background: #fff; border-radius: 16px; padding: 22px; }
  label { display: block; font-size: 0.92rem; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; border: 2px solid #d1d5db; border-radius: 10px; font-size: 1rem; outline: none; }
  input.valid { border-color: #16a34a; background: #f0fdf4; }
  input.invalid { border-color: #dc2626; background: #fef2f2; }
  .hint { font-size: 0.85rem; margin-top: 4px; display: none; color: #dc2626; }
  .hint.show { display: block; }
  button { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #2F4BFF; color: #fff; font-size: 1rem; cursor: pointer; margin-top: 18px; }
  button:hover { background: #1E33CC; }
  #msg { margin-top: 14px; padding: 12px; border-radius: 10px; display: none; background: #dcfce7; color: #166534; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Create Account</h1>
  <p class="sub">Live password-match validation.</p>
  <form id="accountForm">
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" type="password" placeholder="********">
    <label for="confirm">Confirm Password</label>
    <input id="confirm" type="password" placeholder="********">
    <p class="hint" id="hint">Passwords do not match.</p>
    <button type="submit">Create Account</button>
    <div id="msg"></div>
  </form>
</div>
<script>
  const pw = document.getElementById('password');
  const cf = document.getElementById('confirm');
  const hint = document.getElementById('hint');
  function check() {
    const longEnough = pw.value.length >= 8;
    pw.classList.toggle('valid', longEnough);
    pw.classList.toggle('invalid', pw.value !== '' && !longEnough);
    const match = cf.value !== '' && cf.value === pw.value;
    cf.classList.toggle('valid', match);
    cf.classList.toggle('invalid', cf.value !== '' && !match);
    hint.classList.toggle('show', cf.value !== '' && !match);
  }
  pw.addEventListener('input', check);
  cf.addEventListener('input', check);
  document.getElementById('accountForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (pw.value.length >= 8 && pw.value === cf.value) {
      const msg = document.getElementById('msg');
      msg.style.display = 'block';
      msg.textContent = 'Account created successfully! (demo only)';
    }
  });
</script>
</body>
</html>

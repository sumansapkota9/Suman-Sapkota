<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #EAEEF6; background-image: radial-gradient(#C9D1E4 1px, transparent 1px); background-size: 22px 22px; color: #0D1633; padding: 24px 16px 48px; display: flex; justify-content: center; }
  .wrap { width: 100%; max-width: 420px; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; text-align: center; }
  p.sub { color: #4A5578; margin-bottom: 18px; text-align: center; }
  form { background: #fff; border-radius: 16px; padding: 22px; }
  label { display: block; font-size: 0.92rem; margin-bottom: 4px; }
  input { width: 100%; padding: 10px 12px; border: 2px solid #d1d5db; border-radius: 10px; font-size: 1rem; outline: none; }
  input.invalid { border-color: #dc2626; background: #fef2f2; }
  .hint { font-size: 0.85rem; margin-top: 6px; display: none; color: #dc2626; }
  .hint.show { display: block; }
  button { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #2F4BFF; color: #fff; font-size: 1rem; cursor: pointer; margin-top: 18px; }
  button:hover { background: #1E33CC; }
  #msg { margin-top: 14px; padding: 12px; border-radius: 10px; display: none; background: #dcfce7; color: #166534; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Login Demo</h1>
  <p class="sub">Username-only demo login. No password, no real account.</p>
  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Enter your username" autocomplete="off">
    <p class="hint" id="hint">Username is required.</p>
    <button type="submit">Log In</button>
    <div id="msg"></div>
  </form>
</div>
<script>
  const input = document.getElementById('username');
  const hint = document.getElementById('hint');
  const msg = document.getElementById('msg');
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (input.value.trim() === '') {
      input.classList.add('invalid');
      hint.classList.add('show');
      msg.style.display = 'none';
    } else {
      input.classList.remove('invalid');
      hint.classList.remove('show');
      msg.style.display = 'block';
      msg.textContent = 'Welcome, ' + input.value.trim() + '! (demo login)';
    }
  });
</script>
</body>
</html>
